plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tech.sylox.predictor'
    compileSdk 35

    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId 'tech.sylox.predictor'
        minSdk 26
        targetSdk 35
        // CI passes an incrementing VERSION_CODE so signed updates install in place.
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = (System.getenv("VERSION_NAME") ?: "1.0")
        // Built-in Claude key for the AI button: injected by CI from the ANTHROPIC_API_KEY repo secret
        // (never committed). XOR-masked so it isn't a plain string in the APK; empty when not provided.
        def aiKey = System.getenv("AI_KEY") ?: ""
        def mask = "sylox-overlay"
        def kb = aiKey.getBytes("UTF-8")
        def sb = new StringBuilder()
        for (int i = 0; i < kb.length; i++) {
            int v = ((kb[i] as int) ^ (mask.charAt(i % mask.length()) as int)) & 0xff
            sb.append(String.format("%02x", v))
        }
        def masked = sb.toString()
        buildConfigField "String", "AI_KEY_X", "\"" + masked + "\""
    }
    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signed when the keystore env is present (CI); plain unsigned release otherwise.
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false   // never let a lint warning fail the CI build
    }
}

// Zero runtime dependencies — framework WebView/WindowManager/Notification only.
dependencies { }
